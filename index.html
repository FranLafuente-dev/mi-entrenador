<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Entrenador</title>

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mi Entrenador">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0A0A0B">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="lienzo">

  <!-- ============ LOGIN ============ -->
  <section id="vista-login" class="vista vista-centrada oculta">
    <div class="login-caja">
      <img src="icons/icon-192.png" alt="" class="login-icono">
      <h1>Mi Entrenador</h1>
      <p class="login-sub">Presentate, soldado.</p>
      <div id="gis-boton" class="gis-boton"></div>
      <button id="btn-login" class="btn btn-borde btn-grande">Entrar con Google</button>
      <div id="login-error" class="login-error oculta"></div>
      <div id="login-aviso" class="login-aviso oculta"></div>
    </div>
  </section>

  <!-- ============ CARGA (esqueleto) ============ -->
  <section id="vista-carga" class="vista">
    <div class="esq esq-etiqueta"></div>
    <div class="esq esq-titular"></div>
    <div class="esq esq-linea"></div>
    <div class="esq esq-tarjeta"></div>
    <div class="fila-2">
      <div class="esq esq-tarjeta-chica"></div>
      <div class="esq esq-tarjeta-chica"></div>
    </div>
    <div class="esq esq-tarjeta-media"></div>
  </section>

  <!-- ============ INICIO ============ -->
  <section id="vista-inicio" class="vista oculta">
    <header id="inicio-mini" class="mini-cabecera"><span id="inicio-mini-titulo"></span></header>
    <div class="etiqueta" id="inicio-fecha"></div>
    <h1 class="titular" id="inicio-titular"></h1>
    <p class="frase" id="inicio-frase"></p>

    <div id="racha-tarjeta"></div>

    <div class="fila-2">
      <button class="tarjeta tarjeta-tocable" id="tarjeta-entreno"></button>
      <button class="tarjeta tarjeta-tocable" id="tarjeta-agua"></button>
    </div>

    <button class="tarjeta tarjeta-tocable tarjeta-peso" id="tarjeta-peso"></button>

    <div id="logros-zona"></div>
  </section>

  <!-- ============ CALENDARIO ============ -->
  <section id="vista-calendario" class="vista oculta">
    <div class="etiqueta">Calendario</div>
    <h1 class="titular titular-seccion">Tu año</h1>
    <div id="heatmap" class="heatmap"></div>
    <div class="cal-nav">
      <button id="cal-prev" class="btn-icono" aria-label="Mes anterior">‹</button>
      <span id="cal-mes-titulo"></span>
      <button id="cal-sig" class="btn-icono" aria-label="Mes siguiente">›</button>
    </div>
    <div id="cal-grilla" class="cal-grilla"></div>
    <div class="cal-leyenda">
      <span><i class="pv pv-hecha"></i>Hecha</span>
      <span><i class="pv pv-recuperada"></i>Recuperada</span>
      <span><i class="pv pv-causa"></i>Causa mayor</span>
      <span><i class="pv pv-fallada"></i>Fallada</span>
      <span><i class="pv pv-descanso"></i>Descanso</span>
      <span><i class="pv pv-caminata"></i>Con caminata</span>
    </div>
  </section>

  <!-- ============ PROGRESO ============ -->
  <section id="vista-progreso" class="vista oculta">
    <div class="etiqueta">Progreso</div>
    <h1 class="titular titular-seccion">Cómo venís</h1>
    <div class="segmentos segmentos-anchos" id="progreso-segmentos">
      <button data-seg="peso" class="sel">Peso</button>
      <button data-seg="historial">Historial</button>
    </div>
    <div id="progreso-peso"></div>
    <div id="progreso-historial" class="oculta"></div>
  </section>

  <!-- ============ AJUSTES ============ -->
  <section id="vista-ajustes" class="vista oculta">
    <div class="etiqueta">Ajustes</div>
    <h1 class="titular titular-seccion">Configuración</h1>
    <div id="ajustes-contenido"></div>
  </section>

  <!-- ============ ENTRENAMIENTO ============ -->
  <section id="vista-entreno" class="vista vista-entreno oculta">
    <header class="entreno-cabecera">
      <button id="btn-entreno-salir" class="btn-texto">Salir</button>
      <span id="entreno-titulo"></span>
      <span id="entreno-reloj" class="entreno-reloj"></span>
    </header>
    <div id="entreno-contenido" class="entreno-contenido"></div>
  </section>

  <!-- ============ BARRA INFERIOR ============ -->
  <nav id="tabbar" class="tabbar oculta" aria-label="Navegación">
    <button data-tab="inicio" class="tab activo" aria-label="Inicio">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4.5l8 7V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"/></svg>
    </button>
    <button data-tab="calendario" class="tab" aria-label="Calendario">
      <svg viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm-1 5h16M8 3v4m8-4v4"/></svg>
    </button>
    <button id="tab-mas" class="tab-mas" aria-label="Registrar">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button data-tab="progreso" class="tab" aria-label="Progreso">
      <svg viewBox="0 0 24 24"><path d="M4 20V10m5.5 10V4M15 20v-7m5 7V8"/></svg>
    </button>
    <button data-tab="ajustes" class="tab" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3m0 12.4v3M4.5 7.2l2.6 1.5m9.8 5.6 2.6 1.5M2.8 12h3m12.4 0h3M4.5 16.8l2.6-1.5m9.8-5.6 2.6-1.5"/></svg>
    </button>
  </nav>

</div><!-- /lienzo -->

<!-- ============ CAPAS ============ -->
<div id="velo" class="velo oculta"></div>
<div id="hoja" class="hoja oculta">
  <div class="hoja-tirador" id="hoja-tirador"></div>
  <div id="hoja-contenido"></div>
</div>
<div id="banner" class="banner oculta"></div>
<div id="momento" class="momento oculta"></div>
<div id="toasts" class="toasts"></div>

<!-- rutinas y mensajes: scripts clásicos, editables a mano -->
<script src="rutinas.js"></script>
<script src="mensajes.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
